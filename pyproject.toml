[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-parser"
version = "0.1.0"
description = "Spot underpriced eBay UK listings the moment they appear"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ymka" }]
keywords = ["ebay", "monitor", "deals", "reselling", "alerts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.urls]
Homepage = "https://github.com/i-ymka/eBay-parser"
Issues = "https://github.com/i-ymka/eBay-parser/issues"

[project.scripts]
ebay-parser = "ebay_parser.cli:main"

[tool.setuptools.packages.find]
include = ["ebay_parser*"]
